  <script>
    function loadFile(containerId, filePath) {
      fetch(filePath)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return response.text();
        })
        .then(data => {
          document.getElementById(containerId).innerHTML = data;
        })
