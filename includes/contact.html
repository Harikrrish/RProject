<section id="contact" class="wow fadeInUp">
    <div class="container">
      <div class="section-header">
        <h2>Contact Us</h2>
      </div>

      <div class="row contact-info">
        <div class="col-lg-5">
          <div class="contact-address">
            <i class="ion-ios-location-outline"></i>
            <h3>Address</h3>
            <p><a href="">No. 253/44, Chandra Sekar Avenue 1st Street, Thuraipakkam, Chennai - 600097</p></a>
          </div>
          <div class="contact-phone">
            <i class="ion-ios-telephone-outline"></i>
            <h3>Phone Number</h3>
            <p><a href="tel:+919994958369">+91 9994958369</a></p>
          </div>
          <div class="contact-email">
            <i class="ion-ios-email-outline"></i>
            <h3>Email</h3>
            <p><a href="mailto:alankaarinteriors@gmail.com">alankaarinteriors@gmail.com</a></p>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="container">
            <div class="form">

              <!-- Form itself -->
              <div name="sentMessage" class="well" id="contactForm">
                <div class="control-group">
                  <div class="form-group">
                    <input type="text" class="form-control" placeholder="Full Name" id="contactname" required
                      data-validation-required-message="Please enter your name" />
                    <p class="help-block"></p>

                  </div>
                </div>
                <div class="form-group">
                  <div class="controls">
                    <input type="email" class="form-control" placeholder="Email" id="contactemail" required
                      data-validation-required-message="Please enter your email" />
                  </div>
                </div>

                <div class="form-group">
                  <div class="controls">
                    <input type="phone" class="form-control" placeholder="Phone" id="contactphone" required
                      data-validation-required-message="Please enter your phone number" />
                  </div>
                </div>
                <div id="success"> </div>
                <button onclick="sendContactEmail()" class="btn btn-primary pull-right">Send</button><br />
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>
